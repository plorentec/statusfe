# Docker Compose for StatusFe
#
# Everything configurable lives in the environment (see .env.example): copy it
# to .env and edit, then `docker compose up -d`. No override file required.
#
# Corporate network troubleshooting:
# If docker build hangs on npm install (DNS resolution timeout),
# your corporate firewall may block Docker's internal DNS.
#
# Fix: Use host network (enabled below). Remove 'ports:' and set DB_HOST to the postgres container name
#   or use network_mode: host on both services so they share the same network namespace.

services:
  statusfe:
    build:
      context: .
      network: host
    container_name: statusfe
    restart: unless-stopped
    network_mode: host
    environment:
      # 3.8.0: every value a self-hoster must change is driven by the
      # environment, so no local override file is needed. Docker Compose reads
      # these from the shell or from a .env file next to this one.
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0
      # Leave SESSION_SECRET unset to let the app generate one and persist it in
      # the data volume; set it only if you need to share/rotate it deliberately.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-statusfe}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-statusfe-secret}
      - DB_SSL=${DB_SSL:-}
      # First-run admin password. Omit it and the app generates one, prints it
      # once and forces a change on the first login (3.6.0).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional: disable the self-update button, override the release feed.
      - SELF_UPDATE_DISABLED=${SELF_UPDATE_DISABLED:-}
      - SELF_UPDATE_RELEASES_URL=${SELF_UPDATE_RELEASES_URL:-}
    volumes:
      - statusfe-data:/app/data
    # node:20-slim has neither curl nor wget — healthcheck via node fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# The redundant `postgres` service was removed in 2.2.7: it sat in a permanent
# crash loop (port 5432 is owned by the host-native PostgreSQL the app actually
# uses) and provided nothing. The `postgres-data` volume was kept on purpose.

volumes:
  statusfe-data:
  # postgres-data kept (unused since 2.2.7 — the service was removed; the
  # volume is only deleted explicitly).
